services:
  # 1. Service Database MySQL
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Kotek 212"
      MYSQL_DATABASE: marketplace
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Service Backend Go
  backend:
    build: ./marketplace-backend
    container_name: go_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./marketplace-backend/.env
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "Kotek 212"
      DB_NAME: marketplace
    depends_on:
      - mysql_db

  # 3. Service Frontend React
  frontend:
    build: ./marketplace
    container_name: react_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
